name: Project updates

on:
  pull_request:
    paths:
      - ".github/workflows/project-updates.yml"
      - "scripts/update_project_feed.py"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-updates-${{ github.ref }}

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate project updates
        run: python3 scripts/update_project_feed.py "$RUNNER_TEMP/project-feed"

  refresh:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate project updates
        run: python3 scripts/update_project_feed.py "$RUNNER_TEMP/project-feed"
      - name: Publish the generated feed
        shell: bash
        run: |
          branch=profile-updates
          git fetch --no-tags origin "refs/heads/$branch"
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/project-feed/"{README.md,project-updates.svg} .
          git add -- README.md project-updates.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Refresh project updates"
          git push origin "HEAD:refs/heads/$branch"
