name: Project explorer

on:
  pull_request:
    paths:
      - "portfolio/**"
      - "scripts/build_portfolio.py"
      - "scripts/test_portfolio.py"
      - ".github/workflows/portfolio.yml"
      - "data/research-focus.json"
      - "assets/projects/**"
      - "assets/hudson-forge-banner.webp"
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - "scripts/build_portfolio.py"
      - "scripts/test_portfolio.py"
      - ".github/workflows/portfolio.yml"
      - "data/research-focus.json"
      - "assets/projects/**"
      - "assets/hudson-forge-banner.webp"
  schedule:
    - cron: "45 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-explorer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check portfolio and profile generators
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --check portfolio/app.js
      - name: Build PR preview from the public snapshot
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_portfolio.py
      - name: Refresh public repository data and build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_portfolio.py --refresh
      - name: Package the website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the one-time Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          request = Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json", "User-Agent": "Hudson-Forge-Portfolio"},
          )
          try:
              with urlopen(request, timeout=20) as response:
                  configured = json.load(response).get("build_type") == "workflow"
          except HTTPError as error:
              if error.code != 404:
                  raise
              configured = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"configured={str(configured).lower()}\n")
          if not configured:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("## Website built; Pages setup is still needed\n\n")
                  summary.write("Choose **Settings → Pages → Build and deployment → Source: GitHub Actions**. ")
                  summary.write("Then run the **Project explorer** workflow. The build artifact is ready; no site was deployed by this run.\n")
          PY
      - name: Configure Pages
        if: steps.pages.outputs.configured == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the website
        if: steps.pages.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
